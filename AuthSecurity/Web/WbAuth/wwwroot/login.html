<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | WbSystekna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      overflow: hidden;
    }

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 3rem;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-logo {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .login-subtitle {
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }

    .form-group label {
      color: var(--text-main);
      font-weight: 600;
      margin-left: 2px;
    }

    .login-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    #out {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: #fca5a5;
    }

    .success-msg {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid var(--success);
      color: #86efac;
    }

    .info-msg {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--primary);
      color: #bae6fd;
    }

    /* Animated background elements */
    .blob {
      position: absolute;
      width: 300px;
      height: 300px;
      background: var(--primary);
      filter: blur(80px);
      opacity: 0.15;
      z-index: -1;
      border-radius: 50%;
    }

    .blob-1 {
      top: -100px;
      right: -100px;
    }

    .blob-2 {
      bottom: -100px;
      left: -100px;
      background: var(--accent);
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-container">
    <div class="login-card glass-panel">
      <div class="login-logo">WbSystekna</div>
      <div class="login-subtitle">Acesso seguro ao portal administrativo</div>

      <div class="form-group">
        <label for="username">Usuário</label>
        <input id="username" type="text" placeholder="Digite seu usuário" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password">
      </div>

      <button id="btnLogin" style="margin-top: 1rem;">Entrar no Sistema</button>

      <div class="login-footer">
        Esqueceu sua senha? <a href="#">Recuperar acesso</a>
        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05);">
          Não tem uma conta? <a href="#" id="linkRegister">Cadastre-se</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Registration Modal -->
  <div id="modalRegister" class="login-container"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);">
    <div class="login-card glass-panel">
      <div class="login-logo">Criar Conta</div>
      <div class="login-subtitle">Preencha os dados para se registrar</div>

      <div class="form-group">
        <label>Usuário</label>
        <input id="reg-username" type="text" placeholder="Escolha um nome de usuário">
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input id="reg-email" type="email" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input id="reg-password" type="password" placeholder="Mínimo 8 caracteres">
      </div>

      <button id="btnDoRegister" style="margin-top: 1rem;">Finalizar Registro</button>

      <div class="login-footer">
        <a href="#" id="linkBackLogin">Voltar para o Login</a>
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Systekna - Site em Construção</title>
  <link rel="stylesheet" href="/css/main.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .construction-container {
      text-align: center;
      max-width: 600px;
      padding: 3rem;
    }

    .icon-box {
      width: 80px;
      height: 80px;
      background: var(--brand-gradient);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
    }

    .icon-box i {
      color: var(--bg-dark);
      width: 40px;
      height: 40px;
    }

    .badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: var(--secondary);
      color: var(--primary);
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }

    .social-links {
      margin-top: 3rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .social-links i {
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.3s;
    }

    .social-links i:hover {
      color: var(--primary);
    }
  </style>
</head>

<body>
  <div class="centered-container">
    <main class="construction-container glass-panel">
      <div class="badge">BREVE NOVIDADES</div>
      <div class="icon-box">
        <i data-lucide="hard-hat"></i>
      </div>
      <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Systekna</h1>
      <h2 style="color: var(--primary); margin-bottom: 1.5rem;">Site em Construção</h2>
      <p style="color: var(--text-muted); line-height: 1.8; margin-bottom: 2.5rem;">
        Estamos preparando uma experiência digital totalmente nova e poderosa para você.
        Nosso novo portal administrativo está sendo finalizado para oferecer o melhor em gestão e tecnologia.
      </p>

      <div style="display: flex; gap: 1rem; justify-content: center;">
        <button style="width: auto; padding: 0.8rem 2.5rem;" onclick="location.href='/login.html'">Acessar
          Portal</button>
      </div>

      <div class="social-links">
        <i data-lucide="github"></i>
        <i data-lucide="linkedin"></i>
        <i data-lucide="globe"></i>
      </div>
    </main>
  </div>

  <footer
    style="position: fixed; bottom: 2rem; width: 100%; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
    &copy; 2026 Systekna Solutions. Inteligência em cada bit.
  </footer>

  <script>
    // Inicializar ícones
    lucide.createIcons();
  </script>
</body>

</html>

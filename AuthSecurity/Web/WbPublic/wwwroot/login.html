<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - WbSystekna</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      text-align: center;
    }

    .login-logo {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      font-weight: 700;
      background: linear-gradient(to right, #ffffff, #0078d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body>
  <div class="centered-container">
    <div class="login-card glass-panel">
      <div class="login-logo">WbSystekna</div>
      <h1>Acesso ao Portal</h1>
      <div class="form-group">
        <label for="username">Usuário</label>
        <input id="username" type="text" placeholder="Seu usuário" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password">
      </div>
      <button id="btnLogin">Entrar</button>
      <pre id="out" style="margin-top: 1.5rem; display: none;"></pre>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>

</html>

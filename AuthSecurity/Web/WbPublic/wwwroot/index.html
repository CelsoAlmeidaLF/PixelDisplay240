<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WbSystekna - Em Breve</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            color: white;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        p {
            font-size: 1.2rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .icon-box {
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container glass-panel" style="padding: 4rem;">
        <div class="icon-box">
            <i data-lucide="construction" style="width: 80px; height: 80px; color: var(--warning);"></i>
        </div>
        <h1>WbSystekna</h1>
        <p>Estamos construindo algo extraordinário. Nosso ecossistema de infraestrutura e serviços estará disponível em
            breve para produção.</p>
        <div style="margin-top: 3rem;">
            <a href="/login" class="glass-panel"
                style="padding: 1rem 2rem; color: white; text-decoration: none; font-weight: bold; border: 1px solid var(--primary);">Acesso
                Administrativo</a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
